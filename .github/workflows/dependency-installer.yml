name: Dependency installer
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 -m unittest discover -s tests -v
      - name: Verify public artifact and install in an empty Maven repository
        run: python3 tools/install-dependency.py --version 1.0-legacy-d8062cdca816 --maven-repo "$RUNNER_TEMP/tlibs-m2"
