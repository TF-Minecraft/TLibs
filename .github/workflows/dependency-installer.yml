name: Dependency installer
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 -m unittest discover -s tests -v
      - name: Verify public artifact and install in an empty Maven repository
        run: python3 tools/install-dependency.py --version 1.0-legacy-d8062cdca816 --maven-repo "$RUNNER_TEMP/tlibs-m2"
      - name: Prepare consumer fixture
        run: |
          cat > "$RUNNER_TEMP/consumer.xml" <<'XML'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion><groupId>test</groupId><artifactId>consumer</artifactId><version>1</version>
            <properties><tlibs.version>0.0.0</tlibs.version></properties>
            <dependencies><dependency><groupId>me.plugins</groupId><artifactId>tlibs</artifactId>
              <version>${tlibs.version}</version><scope>provided</scope></dependency></dependencies>
          </project>
          XML
          cp "$RUNNER_TEMP/consumer.xml" consumer-test.xml
      - name: Resolve and install latest stable release
        id: latest
        uses: ./.github/actions/setup
        with:
          version: latest
          pom: consumer-test.xml
      - name: Check Maven sees the resolved version
        env:
          RESOLVED_TLIBS_VERSION: ${{ steps.latest.outputs.version }}
        run: |
          mvn -B --no-transfer-progress -f consumer-test.xml help:evaluate \
            -Dexpression=tlibs.version -Doutput="$RUNNER_TEMP/resolved-version"
          test "$(cat "$RUNNER_TEMP/resolved-version")" = "$RESOLVED_TLIBS_VERSION"
      - name: Resolve direct shared plugin inputs
        uses: ./.github/actions/setup-plugins
        with:
          mode: latest
          pom: consumer-test.xml
      - name: Verify resolved dependency metadata
        run: |
          python3 - <<'PYTEST'
          import json, pathlib
          resolved = json.loads(pathlib.Path('.build/plugin-dependencies.json').read_text())
          assert len(resolved) == 1
          assert resolved[0]['coordinates'].startswith('me.plugins:tlibs:')
          assert len(resolved[0]['sha256']) == 64
          PYTEST
